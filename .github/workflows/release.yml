name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin.json version
        run: python3 -I scripts/validate_skill.py --tag "$GITHUB_REF_NAME"

      - name: Package skill
        run: |
          cd skills
          zip -r "../cybersec-skill-$GITHUB_REF_NAME.zip" cybersec

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "cybersec-skill-$GITHUB_REF_NAME.zip" \
            --title "cybersec $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Install with \`npx skills add marcelomizuno/cybersec\` or \`/plugin marketplace add marcelomizuno/cybersec\`. The attached zip can be uploaded as a custom skill in Claude.ai (Settings > Capabilities > Skills)."
